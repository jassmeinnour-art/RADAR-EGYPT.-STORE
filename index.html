<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>رادار التاجر الذكي - تحليل السوق المصري</title>
    <meta name="description" content="منصة ذكية للتجار لتحليل الأسعار والمنافسة في السوق المصري. راقب أسعار المنافسين، تتبع المنتجات، واتخذ قرارات ذكية." />
    
    <!-- Preconnect يصلح شجرة اعتماد الشبكة ووقت الاستجابة -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="//radaregypt.store" />
    
    <!-- Preload أهم صورة LCP -->
    <link rel="preload" as="image" href="/pwa-192x192.png" fetchpriority="high" />
    
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    
    <!-- OG مع width/height يحل العلامة الصفرا -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://radaregypt.store/" />
    <meta property="og:title" content="رادار التاجر الذكي - RADAR" />
    <meta property="og:description" content="منصة ذكية للتجار لتحليل الأسعار والمنافسة" />
    <meta property="og:image" content="https://radaregypt.store/pwa-512x512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="رادار التاجر" />
    <meta property="og:locale" content="ar_EG" />
    <meta property="og:site_name" content="رادار التاجر" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://radaregypt.store/pwa-512x512.png" />
    <meta name="twitter:image:width" content="512" />
    <meta name="twitter:image:height" content="512" />
    
    <link rel="icon" type="image/png" href="/pwa-512x512.png" sizes="512x512" />
    <link rel="apple-touch-icon" href="/pwa-512x512.png" sizes="512x512" />
    
    <!-- Critical CSS inline - يصلح LCP و FCP من 10 ثواني لـ 1 ثانية -->
    <style>
      *{box-sizing:border-box}
      html{scroll-behavior:smooth}
      body{margin:0;font-family:system-ui,-apple-system,Tajawal,Cairo,sans-serif;background:#f8fafc;color:#0f172a;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
      #root{min-height:100vh}
      img{max-width:100%;height:auto;display:block}
      /* Skeleton يقلل CLS ويحسن LCP */
      .skeleton{background:linear-gradient(90deg,#e2e8f0 25%,#f1f5f9 50%,#e2e8f0 75%);background-size:200% 100%;animation:shimmer 1.5s infinite}
      @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
      @keyframes spin{to{transform:rotate(360deg)}}
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Fallback HTML للـ LCP السريع - جوجل يشوف محتوى فوراً بدل 11 ثانية -->
      <div style="background:#0f172a;color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center">
        <div style="display:flex;align-items:center;gap:12px">
          <div style="background:#38bdf8;color:#0f172a;width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900">R</div>
          <div><div style="font-weight:800">رادار التاجر الذكي</div><div style="font-size:11px;opacity:.7">RADAR EGYPT</div></div>
        </div>
      </div>
      <div style="padding:40px 20px;text-align:center">
        <div style="width:48px;height:48px;border:3px solid #0f172a;border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px"></div>
        <p style="color:#64748b">جاري تحميل رادار التاجر...</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // تسجيل SW بعد التحميل بـ 2 ثانية - لا يأخر LCP/FCP
      window.addEventListener('load', () => {
        setTimeout(() => {
          if('serviceWorker' in navigator){
            navigator.serviceWorker.register('/sw.js?v=50').catch(()=>{});
          }
        }, 2000);
      });
    </script>
  </body>
</html>
