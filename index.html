    <script>
      (function() {
        var isWsErr = function(s) {
          if (!s) return false;
          var str = String(s);
          return str.indexOf('WebSocket') !== -1 || str.indexOf('ws:') !== -1 || str.indexOf('wss:') !== -1 || str.indexOf('moduleRunnerTransport') !== -1 || str.indexOf('createWebSocketModuleRunnerTransport') !== -1;
        };
        window.addEventListener('error', function(e) {
          if (e && (isWsErr(e.message) || isWsErr(e.filename) || isWsErr(e.error))) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          var reason = e && (e.reason && (e.reason.message || e.reason.stack) || e.reason);
          if (isWsErr(reason)) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>
