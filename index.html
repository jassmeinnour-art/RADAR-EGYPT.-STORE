<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: data:; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' https:; connect-src 'self' https://firestore.googleapis.com https://*.googleapis.com https://*.firebaseio.com;" />
    <script>
      (function() {
        function isViteWsError(err) {
          if (!err) return false;
          var str = (err.message || '') + ' ' + (err.stack || '') + ' ' + (err.filename || '') + ' ' + String(err);
          var lower = str.toLowerCase();
          return lower.indexOf('websocket') !== -1 ||
                 lower.indexOf('@vite/client') !== -1 ||
                 lower.indexOf('modulerunner') !== -1 ||
                 lower.indexOf('modulerunnertransport') !== -1 ||
                 lower.indexOf('createwebsocketmodulerunnertransport') !== -1 ||
                 lower.indexOf('failed to connect to websocket') !== -1 ||
                 lower.indexOf('vite:ws') !== -1 ||
                 lower.indexOf('closed without opened') !== -1 ||
                 lower.indexOf('ws://') !== -1 ||
                 lower.indexOf('wss://') !== -1;
        }

        // Intercept console.error to prevent Vite HMR connection logs from triggering applet error alerts
        var origConsoleError = console.error;
        console.error = function() {
          var str = '';
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            str += ' ' + ((arg && arg.message) || (arg && arg.stack) || String(arg || ''));
          }
          if (isViteWsError(str)) {
            return;
          }
          return origConsoleError.apply(console, arguments);
        };

        window.addEventListener('error', function(e) {
          if (isViteWsError(e.error) || isViteWsError(e.message) || isViteWsError(e.filename) || (e.filename && e.filename.indexOf('@vite/client') !== -1)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (isViteWsError(e.reason) || isViteWsError(e)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        var prevOnError = window.onerror;
        window.onerror = function(msg, url, lineNo, colNo, err) {
          if (isViteWsError(msg) || isViteWsError(url) || isViteWsError(err)) {
            return true;
          }
          if (typeof prevOnError === 'function') {
            return prevOnError.apply(this, arguments);
          }
          return false;
        };

        var prevOnUnhandledRejection = window.onunhandledrejection;
        window.onunhandledrejection = function(e) {
          if (isViteWsError(e && (e.reason || e))) {
            if (e && e.preventDefault) e.preventDefault();
            return true;
          }
          if (typeof prevOnUnhandledRejection === 'function') {
            return prevOnUnhandledRejection.apply(this, arguments);
          }
        };

        // Safe WebSocket wrapper
        if (typeof window !== 'undefined' && 'WebSocket' in window) {
          var RealWebSocket = window.WebSocket;
          function isViteOrHmrWs(url, protocols) {
            var urlStr = String(url || '').toLowerCase();
            var protoStr = (Array.isArray(protocols) ? protocols.join(',') : String(protocols || '')).toLowerCase();
            return protoStr.indexOf('vite') !== -1 ||
                   protoStr.indexOf('hmr') !== -1 ||
                   urlStr.indexOf('vite') !== -1 ||
                   urlStr.indexOf('hmr') !== -1 ||
                   urlStr.indexOf('token=') !== -1 ||
                   urlStr.indexOf('24678') !== -1 ||
                   urlStr.indexOf('modulerunner') !== -1;
          }
          window.WebSocket = function(url, protocols) {
            if (isViteOrHmrWs(url, protocols)) {
              var noop = function() {};
              var listeners = {};
              var fakeWs = {
                url: url,
                readyState: 1, 
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                bufferedAmount: 0,
                extensions: '',
                protocol: typeof protocols === 'string' ? protocols : (Array.isArray(protocols) ? protocols[0] : ''),
                binaryType: 'blob',
                close: function() { fakeWs.readyState = 3; },
                send: noop,
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null,
                addEventListener: function(type, fn) {
                  listeners[type] = listeners[type] || [];
                  listeners[type].push(fn);
                  if (type === 'open') {
                    setTimeout(function() {
                      try {
                        if (typeof fakeWs.onopen === 'function') fakeWs.onopen({ type: 'open', target: fakeWs });
                        fn({ type: 'open', target: fakeWs });
                      } catch(e) {}
                    }, 0);
                  }
                },
                removeEventListener: function(type, fn) {
                  if (listeners[type]) {
                    listeners[type] = listeners[type].filter(function(cb) { return cb !== fn; });
                  }
                },
                dispatchEvent: function(event) {
                  var type = (event && event.type) || '';
                  var list = listeners[type] || [];
                  for (var i = 0; i < list.length; i++) {
                    try { list[i](event); } catch(e) {}
                  }
                  return true;
                }
              };
              try {
                Object.setPrototypeOf(fakeWs, RealWebSocket.prototype);
              } catch(e) {}
              return fakeWs;
            }
            return new RealWebSocket(url, protocols);
          };
          window.WebSocket.prototype = RealWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        // Early theme detection
        try {
          var savedMode = localStorage.getItem('radar_global_color_mode_v7_offwhite_black') || 'light';
          var isDark = savedMode === 'dark' || (savedMode === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark', 'theme-dark');
            document.documentElement.classList.remove('light', 'theme-light');
          } else {
            document.documentElement.classList.add('light', 'theme-light');
            document.documentElement.classList.remove('dark', 'theme-dark');
          }
        } catch(e) {}


        // AUTO-RELOAD ON CHUNK LOAD FAILURE
        window.addEventListener('error', function(e) {
          if (e && e.message && (e.message.indexOf('Loading chunk') !== -1 || e.message.indexOf('unexpected token <') !== -1)) {
            console.warn('Chunk load failure detected, forcing reload...');
            window.location.reload();
          }
        }, true);
      })();
    </script>
    
    <!-- Critical Preconnects -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://firestore.googleapis.com" />
    
    <!-- Preload Critical Assets -->
    <link rel="preload" href="/pwa-192x192.png" as="image" fetchpriority="high" />
    
    <title>رادار التاجر الذكي - تحليل السوق المصري</title>
    <meta name="description" content="منصة ذكية للتجار لتحليل الأسعار والمنافسة في السوق المصري. راقب أسعار المنافسين، تتبع المنتجات، واتخذ قرارات ذكية." />
    
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f172a" />
    
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://radaregypt.store/" />
    <meta property="og:title" content="رادار التاجر الذكي - RADAR" />
    <meta property="og:description" content="منصة ذكية للتجار لتحليل الأسعار والمنافسة - رصد فوري لأسعار المنتجات في السوق المصري" />
    <meta property="og:image" content="https://radaregypt.store/pwa-512x512.png" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/pwa-512x512.png" />
    <link rel="apple-touch-icon" href="/pwa-512x512.png" />
  </head>
  <body>
    <div id="root">
      <!-- Fallback Loading Shell: Shown while React bundle loads or if offline / network delayed -->
      <div id="app-boot-fallback" style="min-height: 100vh; background-color: #020617; color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; font-family: 'Cairo', system-ui, -apple-system, sans-serif; text-align: center; direction: rtl;">
        <div style="width: 200px; height: 200px; border-radius: 40px; background: linear-gradient(135deg, #FF6B00, #d97706); padding: 4px; box-shadow: 0 15px 30px -5px rgba(255, 107, 0, 0.5); margin-bottom: 25px; display: flex; align-items: center; justify-content: center;">
          <img src="/pwa-192x192.png" alt="رادار التاجر" style="width: 100%; height: 100%; object-fit: cover; border-radius: 17px;" onerror="this.style.display='none';" />
        </div>
        <h1 style="font-size: 20px; font-weight: 900; margin: 0 0 8px 0; color: #ffffff;">رادار التاجر الذكي (RADAR EGYPT)</h1>
        <p style="font-size: 13px; color: #fbbf24; margin: 0 0 24px 0; font-weight: 700;">جاري تحميل بيانات المنظومة والأسواق...</p>
        
        <!-- Loading Spinner -->
        <div style="width: 40px; height: 40px; border: 4px solid rgba(255, 255, 255, 0.1); border-top-color: #f59e0b; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 24px;"></div>
        <style>
          @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        </style>

        <!-- Delayed Recovery Action (Visible if loading takes longer than 5 seconds) -->
        <div id="boot-delayed-action" style="display: none; margin-top: 12px; background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(245, 158, 11, 0.3); border-radius: 16px; padding: 16px; max-width: 360px;">
          <p style="font-size: 12px; color: #cbd5e1; margin: 0 0 12px 0;">إذا استغرق التحميل وقتاً طويلاً أو ظهرت شاشة فارغة، يرجى إعادة تحديث الصفحة:</p>
          <button onclick="window.location.reload(true);" style="background: #f59e0b; color: #020617; border: none; padding: 10px 18px; border-radius: 10px; font-weight: 800; font-size: 13px; cursor: pointer; transition: transform 0.2s;">
            إعادة تحميل التطبيق 🔄
          </button>
        </div>
        <script>
          setTimeout(function() {
            var delayedBox = document.getElementById('boot-delayed-action');
            if (delayedBox && document.getElementById('app-boot-fallback')) {
              delayedBox.style.display = 'block';
            }
          }, 5000);
        </script>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
