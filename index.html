    <!-- SEO Structured Data for 75% -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "رادار التاجر الذكي",
      "alternateName": "RADAR Egypt",

      "author": { "@type": "Organization", "name": "Radar Egypt", "url": "https://radaregypt.store" },
      "inLanguage": "ar-EG"
    }
    </script>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <script>
      let deferredPrompt = null;
      let isInstalled = false;
      if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) { isInstalled = true; }
      window.addEventListener('beforeinstallprompt', (e) => {
        console.log('✅ PWA ready!');
        e.preventDefault();
        deferredPrompt = e;
        setTimeout(() => {
          const c = document.getElementById('pwa-install-container');
          if (c && !isInstalled) c.classList.add('show');
        }, 3000);
      });
      window.addEventListener('appinstalled', () => {
        isInstalled = true;
        document.getElementById('pwa-install-container').style.display = 'none';
        deferredPrompt = null;
      });
      async function installPWA() {
        if (!deferredPrompt) {
          const isAndroid = /Android/.test(navigator.userAgent);
          const isWindows = /Windows/.test(navigator.userAgent);
          if (isAndroid || isWindows) {
            window.open('https://www.pwabuilder.com/report?site=https://radaregypt.store', '_blank');
          } else {
            alert('لتثبيت التطبيق:\n📱 آيفون: مشاركة ⬆️ ثم إضافة للشاشة الرئيسية\n💻 ويندوز: ⋮ ثم تثبيت التطبيق');
          }
          return;
        }
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') document.getElementById('pwa-install-container').style.display = 'none';
        deferredPrompt = null;
      }
      function dismissInstall() {
        const c = document.getElementById('pwa-install-container');
        c.classList.remove('show');
        setTimeout(() => c.style.display = 'none', 400);
        setTimeout(() => { if (!isInstalled && deferredPrompt) { c.style.display = 'block'; c.classList.add('show'); } }, 3600000);
      }
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(()=>{});
        });
      }
    </script>
    <div id="pwa-install-container" style="position: fixed; bottom: 16px; left: 16px; right: 16px; z-index: 9999; max-width: 400px; margin: 0 auto;">
      <div style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; border-radius: 20px; padding: 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border: 1px solid #334155; box-shadow: 0 20px 40px rgba(0,0,0,0.3);">
        <div style="display: flex; align-items: center; gap: 12px; flex: 1;">
          <div style="width: 48px; height: 48px; background: white; border-radius: 12px; display: flex; align-items: center; justify-content: center;">
            <img src="/pwa-192x192.png" alt="RADAR" style="width: 40px; height: 40px; border-radius: 8px;" />
          </div>
          <div style="flex: 1;">
            <p style="font-weight: bold; font-size: 14px; margin: 0;">ثبتي تطبيق رادار التاجر</p>
            <p style="font-size: 11px; color: #cbd5e1; margin: 2px 0 0 0;">🤖 أندرويد • 🪟 ويندوز • سريع</p>
          </div>
        </div>
        <div style="display: flex; gap: 8px; align-items: center;">
          <button onclick="dismissInstall()" style="background: transparent; border: none; color: #94a3b8; padding: 8px 12px; font-size: 12px; cursor: pointer;">لاحقاً</button>
          <button onclick="installPWA()" style="background: white; color: #0f172a; border: none; padding: 10px 20px; border-radius: 12px; font-weight: bold; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px; white-space: nowrap;">⬇️ تثبيت</button>
        </div>
      </div>
    </div>
