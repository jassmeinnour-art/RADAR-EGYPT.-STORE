      if (window.location.hostname.includes('dev.')) {
        const meta = document.createElement('meta');
        meta.name = 'robots';
        meta.content = 'noindex, nofollow';

    <script>
      (function() {
        function isViteWsError(err) {
          if (!err) return false;
          var str = (err.message || '') + ' ' + (err.stack || '') + ' ' + (err.filename || '') + ' ' + String(err);
          var lower = str.toLowerCase();
          return lower.indexOf('websocket') !== -1 ||
                 lower.indexOf('@vite/client') !== -1 ||
                 lower.indexOf('modulerunner') !== -1 ||
                 lower.indexOf('modulerunnertransport') !== -1 ||
                 lower.indexOf('createwebsocketmodulerunnertransport') !== -1 ||
                 lower.indexOf('failed to connect to websocket') !== -1 ||
                 lower.indexOf('vite:ws') !== -1 ||
                 lower.indexOf('closed without opened') !== -1 ||
                 lower.indexOf('ws://') !== -1 ||
                 lower.indexOf('wss://') !== -1;
        }

        // Intercept console.error to prevent Vite HMR connection logs from triggering applet error alerts
        var origConsoleError = console.error;
        console.error = function() {
          var str = '';
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            str += ' ' + ((arg && arg.message) || (arg && arg.stack) || String(arg || ''));
          }
          if (isViteWsError(str)) {
            return;
          }
          return origConsoleError.apply(console, arguments);
        };

        window.addEventListener('error', function(e) {
          if (isViteWsError(e.error) || isViteWsError(e.message) || isViteWsError(e.filename) || (e.filename && e.filename.indexOf('@vite/client') !== -1)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (isViteWsError(e.reason) || isViteWsError(e)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        var prevOnError = window.onerror;
        window.onerror = function(msg, url, lineNo, colNo, err) {
          if (isViteWsError(msg) || isViteWsError(url) || isViteWsError(err)) {
            return true;
          }
          if (typeof prevOnError === 'function') {
            return prevOnError.apply(this, arguments);
          }
          return false;
        };

        var prevOnUnhandledRejection = window.onunhandledrejection;
        window.onunhandledrejection = function(e) {
          if (isViteWsError(e && (e.reason || e))) {
            if (e && e.preventDefault) e.preventDefault();
            return true;
          }
          if (typeof prevOnUnhandledRejection === 'function') {
            return prevOnUnhandledRejection.apply(this, arguments);
          }
        };

        // Safe WebSocket wrapper
        if (typeof window !== 'undefined' && 'WebSocket' in window) {
          var RealWebSocket = window.WebSocket;
          function isViteOrHmrWs(url, protocols) {
            var urlStr = String(url || '').toLowerCase();
            var protoStr = (Array.isArray(protocols) ? protocols.join(',') : String(protocols || '')).toLowerCase();
            return protoStr.indexOf('vite') !== -1 ||
                   protoStr.indexOf('hmr') !== -1 ||
                   urlStr.indexOf('vite') !== -1 ||
                   urlStr.indexOf('hmr') !== -1 ||
                   urlStr.indexOf('token=') !== -1 ||
                   urlStr.indexOf('24678') !== -1 ||
                   urlStr.indexOf('modulerunner') !== -1;
          }
          window.WebSocket = function(url, protocols) {
            if (isViteOrHmrWs(url, protocols)) {
              var noop = function() {};
              var listeners = {};
              var fakeWs = {
                url: url,
                readyState: 1, 
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                bufferedAmount: 0,
                extensions: '',
                protocol: typeof protocols === 'string' ? protocols : (Array.isArray(protocols) ? protocols[0] : ''),
                binaryType: 'blob',
                close: function() { fakeWs.readyState = 3; },
                send: noop,
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null,
                addEventListener: function(type, fn) {
                  listeners[type] = listeners[type] || [];
                  listeners[type].push(fn);
                  if (type === 'open') {
                    setTimeout(function() {
                      try {
                        if (typeof fakeWs.onopen === 'function') fakeWs.onopen({ type: 'open', target: fakeWs });
                        fn({ type: 'open', target: fakeWs });
                      } catch(e) {}
                    }, 0);
                  }
                },
                removeEventListener: function(type, fn) {
                  if (listeners[type]) {
                    listeners[type] = listeners[type].filter(function(cb) { return cb !== fn; });
                  }
                },
                dispatchEvent: function(event) {
                  var type = (event && event.type) || '';
                  var list = listeners[type] || [];
                  for (var i = 0; i < list.length; i++) {
                    try { list[i](event); } catch(e) {}
                  }
                  return true;
                }
              };
              try {
                Object.setPrototypeOf(fakeWs, RealWebSocket.prototype);
              } catch(e) {}
              return fakeWs;
            }
            return new RealWebSocket(url, protocols);
          };
          window.WebSocket.prototype = RealWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        // Early theme detection (Dark High Contrast / Clean Light)
        try {
          var savedVariant = localStorage.getItem('radar_active_theme_variant');
          var savedMode = localStorage.getItem('radar_global_color_mode_v7_offwhite_black') || 'light';
          var isDark =
            savedVariant === 'dark-high-contrast' ||
            savedMode === 'dark' ||
            (savedMode === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var rootEl = document.documentElement;
          if (isDark) {
            rootEl.setAttribute('data-theme', 'dark-high-contrast');
            rootEl.setAttribute('data-color-mode', 'dark');
            rootEl.classList.add('dark', 'theme-dark', 'theme-dark-high-contrast');
            rootEl.classList.remove('light', 'theme-light', 'theme-clean-light');
          } else {
            rootEl.setAttribute('data-theme', 'clean-light');
            rootEl.setAttribute('data-color-mode', 'light');
            rootEl.classList.add('light', 'theme-light', 'theme-clean-light');
            rootEl.classList.remove('dark', 'theme-dark', 'theme-dark-high-contrast');
          }
          var isHighContrast = localStorage.getItem('radar_high_contrast_mode') === 'true';
          rootEl.setAttribute('data-high-contrast', isHighContrast ? 'true' : 'false');
          if (isHighContrast) {
            rootEl.classList.add('high-contrast');
          } else {
            rootEl.classList.remove('high-contrast');
          }
        } catch(e) {}


        function recoverChunkSafely() {
          try {
            var lastReload = parseInt(sessionStorage.getItem('radar_boot_chunk_reload') || '0', 10);
            if (!lastReload || Date.now() - lastReload > 10000) {
              sessionStorage.setItem('radar_boot_chunk_reload', String(Date.now()));
              window.location.reload();
              return true;
            }
          } catch (storageErr) {}
          return false;
        }
        window.__RADAR_SHOW_BOOT_ERROR__ = function() {};

        // LOOP-SAFE CHUNK ERROR RECOVERY ONLY (never overwrite #root with a blocking error screen)
        window.addEventListener('error', function(e) {
          var msg = (e && e.message) || '';
          var filename = (e && e.filename) || '';
          var targetSrc = (e && e.target && e.target.src) || '';
          var isAppAsset = filename.indexOf('/assets/') !== -1 || targetSrc.indexOf('/assets/') !== -1;
          var isChunkErr =
            msg.indexOf('Loading chunk') !== -1 ||
            msg.indexOf('Failed to fetch dynamically imported module') !== -1 ||
            (msg.indexOf('unexpected token <') !== -1 && (isAppAsset || !window.__RADAR_APP_MOUNTED__));

          if (isChunkErr) {
            recoverChunkSafely();
          }
        }, true);
        // Clear stale radar-card-size / radar-user localStorage on /login immediately
        try {
          if (window.location && window.location.pathname === '/login' && window.localStorage) {
            var toRemove = [];
            for (var idx = 0; idx < localStorage.length; idx++) {
              var k = localStorage.key(idx);
              if (k && (k.indexOf('radar-card-size') === 0 || k.indexOf('radar-user') === 0 || k === 'merchant_radar_demo_user')) {
                toRemove.push(k);
              }
            }
            for (var r = 0; r < toRemove.length; r++) {
              localStorage.removeItem(toRemove[r]);
            }
          }
        } catch(e) {}
      })();
    </script>
