name: Vercel Production Deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          
      - name: Install dependencies
        run: npm install
        
      - name: Lint and Type Check
        run: npm run lint
        
      - name: Run tests
        run: npm test
        
      - name: Assert Environment Variables
        run: |
          echo "Checking required environment variables for production build..."
          VARIABLES=(
            "VITE_FIREBASE_API_KEY" 
            "VITE_FIREBASE_PROJECT_ID" 
            "VITE_FIREBASE_APP_ID"
            "GEMINI_API_KEY"
            "AMAZON_CLIENT_ID"
            "AMAZON_CLIENT_SECRET"
            "AMAZON_REFRESH_TOKEN"
            "LWA_ENVELOPE_SECRET"
          )
          for VAR in "${VARIABLES[@]}"; do
            if [ -z "${!VAR}" ]; then
              echo "Warning: $VAR is not set. Building without it may lead to runtime failures."
              # exit 1 # Uncomment to fail build if vars are missing
            fi
          done

      - name: Production Build
        run: npm run build
        env:
          VITE_APP_ENV: production
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_DATABASE_ID: ${{ secrets.VITE_FIREBASE_DATABASE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          
      - name: Deploy to Vercel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx vercel --token ${{ secrets.VERCEL_TOKEN }} --prod --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
