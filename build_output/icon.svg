<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Luxury Obsidian Dark Background -->
    <radialGradient id="obsidianBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#18150D" />
      <stop offset="55%" stop-color="#0D0C09" />
      <stop offset="100%" stop-color="#060608" />
    </radialGradient>

    <!-- Brushed Metallic Gold Gradient -->
    <linearGradient id="metallicGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#926F23" />
    </linearGradient>

    <!-- Bright Gold Highlight -->
    <linearGradient id="brightGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>

    <!-- Soft Gold Glow Filter -->
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Dark Obsidian Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#obsidianBg)" />
  <rect width="500" height="500" x="6" y="6" rx="106" fill="none" stroke="url(#metallicGold)" stroke-width="3" stroke-opacity="0.45" />

  <!-- Outer Technical Radar Ring & Ticks -->
  <circle cx="256" cy="240" r="175" fill="none" stroke="url(#metallicGold)" stroke-width="1.5" stroke-opacity="0.28" stroke-dasharray="4 6" />
  <circle cx="256" cy="240" r="152" fill="none" stroke="url(#metallicGold)" stroke-width="1.2" stroke-opacity="0.2" />

  <!-- Iconic Open Gold Radar Ring (Matches RADAR Brand Mark) -->
  <path
    d="M 256 105 A 135 135 0 1 1 162 143"
    fill="none"
    stroke="url(#brightGold)"
    stroke-width="6"
    stroke-linecap="round"
    filter="url(#goldGlow)"
  />

  <!-- Geodesic Gold Wireframe Sphere -->
  <g stroke="url(#metallicGold)" stroke-width="1.8" stroke-opacity="0.65" fill="none">
    <circle cx="256" cy="240" r="102" stroke-width="2.5" stroke-opacity="0.85" />
    <!-- Latitude & Longitude Ellipses -->
    <ellipse cx="256" cy="240" rx="102" ry="42" />
    <ellipse cx="256" cy="240" rx="42" ry="102" />
    <ellipse cx="256" cy="240" rx="78" ry="102" />
    <!-- Geodesic Triangulation Lines -->
    <polygon points="256,138 334,198 298,282 214,282 178,198" stroke-opacity="0.55" />
    <polygon points="256,342 334,282 298,198 214,198 178,282" stroke-opacity="0.45" />
    <line x1="256" y1="138" x2="256" y2="342" stroke-opacity="0.4" />
    <line x1="154" y1="240" x2="358" y2="240" stroke-opacity="0.4" />
    <line x1="178" y1="198" x2="334" y2="282" stroke-opacity="0.45" />
    <line x1="334" y1="198" x2="178" y2="282" stroke-opacity="0.45" />
  </g>

  <!-- Sweeping Orbital Ring -->
  <ellipse
    cx="256"
    cy="240"
    rx="158"
    ry="46"
    transform="rotate(-22 256 240)"
    fill="none"
    stroke="url(#brightGold)"
    stroke-width="3.2"
    stroke-opacity="0.9"
    filter="url(#goldGlow)"
  />

  <!-- Glowing Gold Vertex Nodes -->
  <g fill="#FEF3C7" filter="url(#goldGlow)">
    <!-- Signature Top-Right Radar Ping Dot -->
    <circle cx="312" cy="166" r="9" fill="#FBBF24" />
    <circle cx="312" cy="166" r="16" fill="none" stroke="#F59E0B" stroke-width="2" stroke-opacity="0.7" />
    <!-- Secondary Marketplace Nodes -->
    <circle cx="214" cy="198" r="5" />
    <circle cx="298" cy="282" r="5.5" />
    <circle cx="195" cy="276" r="5" />
    <circle cx="256" cy="240" r="6" />
  </g>

  <!-- RADAR Wordmark at Bottom -->
  <text
    x="256"
    y="448"
    text-anchor="middle"
    fill="url(#brightGold)"
    font-family="sans-serif"
    font-size="40"
    font-weight="700"
    letter-spacing="18"
  >
    RADAR
  </text>
</svg>
